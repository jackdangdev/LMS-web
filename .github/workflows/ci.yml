name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: API · lint-free tests (Mocha + Chai + Supertest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 1h
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/edunova_lms_test
    defaults:
      run:
        working-directory: lms-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms-backend/package-lock.json
      - run: npm ci
      - name: Run API test suite
        run: npm test

  frontend:
    name: Web · unit tests (Vitest) + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms-frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: lms-frontend/dist
          retention-days: 7

  e2e:
    name: E2E · Cypress (login, browse, enrol, CRUD)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: development
      JWT_SECRET: ci_test_secret
      MONGO_URI: mongodb://127.0.0.1:27017/edunova_lms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API deps and seed
        working-directory: lms-backend
        run: npm ci && npm run seed
      - name: Install web deps
        working-directory: lms-frontend
        run: npm ci
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: lms-frontend
          start: |
            npm start --prefix ../lms-backend
            npm run dev
          wait-on: 'http://localhost:5173, http://localhost:5000/api/health'
          wait-on-timeout: 120
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: |
            lms-frontend/cypress/screenshots
            lms-frontend/cypress/videos
          retention-days: 7
